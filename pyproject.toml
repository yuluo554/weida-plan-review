[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "planguard"
version = "0.1.0"
description = "PlanGuard（方案卫士）—— 危大工程专项施工方案智能审查系统（规则优先 + LLM 兜底）"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PlanGuard contributors" }]
keywords = ["construction", "safety", "llm", "agent", "compliance", "review"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# 核心链路零第三方依赖；解析/LLM/Web 按里程碑安装 extras（plan/02 §3 依赖分层）
dependencies = []

[project.optional-dependencies]
parse = ["python-docx>=0.8.11", "pdfplumber>=0.10"]
llm = ["openai>=1.30"]
web = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.5"]  # multipart 为 File 上传必需（M6 干净环境实测缺它会启动即崩）
dev = ["pytest", "reportlab>=3.6", "httpx>=0.24"]  # reportlab 仅测试用（生成中文 PDF 样例）；httpx 供 FastAPI TestClient

[project.scripts]
planguard = "planguard.cli:main"

[tool.setuptools]
# planguard.rules.data 只装 JSON 规则、无 __init__.py；显式列入避免 setuptools
# 报 "Package would be ignored" 的 ambiguous configuration 警告。
packages = [
    "planguard",
    "planguard.ir",
    "planguard.parsers",
    "planguard.rules",
    "planguard.rules.data",
    "planguard.knowledge",
    "planguard.llm",
    "planguard.report",
    "planguard.web",
]

[tool.setuptools.package-data]
planguard = ["rules/data/*.json"]
